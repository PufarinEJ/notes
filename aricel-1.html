<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>git log --dragoste</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff4ee; --ink:#4a2e22; --accent:#ef6f94; --soft:#fde3e8; --term:#2b2438;
    --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; color:var(--ink); overflow:hidden;
    font-family:"Nunito", ui-rounded, system-ui, sans-serif;
    background: radial-gradient(circle at 50% 25%, #fff 0%, var(--bg) 55%, #fde2d6 100%); }
  .wrap { height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; padding:16px; text-align:center; }

  /* scena cu aricei */
  svg.scene { width:min(360px, 88vw); height:auto; overflow:visible; }
  svg.scene.spin { animation:spin360 1.3s ease-in-out; }
  @keyframes spin360 { to { transform:rotateY(360deg); } }
  #him, #her { transition: transform 1.1s cubic-bezier(.5,1.6,.4,1), opacity .8s; }
  #him { transform: translateX(130px); }
  #her { transform: translateX(330px); opacity:0; }
  .yes #him { transform: translateX(10px); }
  .yes #her { transform: translateX(250px); opacity:1; }
  .bob { animation:bob 2.6s ease-in-out infinite; }
  .bob.late { animation-delay:-1.3s; }
  @keyframes bob { 50% { transform:translateY(-6px); } }
  .hop .bob { animation:hop .6s ease-out; }
  @keyframes hop { 40% { transform:translateY(-22px); } 70% { transform:translateY(2px); } }
  .shadow { animation:shad 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .shadow.late { animation-delay:-1.3s; }
  @keyframes shad { 50% { transform:scaleX(.88); opacity:.7; } }
  #ring { animation:float 2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes float { 50% { transform:translateY(-6px) rotate(8deg); } }
  .twinkle { animation:tw 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .twinkle.d2 { animation-delay:.5s; } .twinkle.d3 { animation-delay:1s; }
  @keyframes tw { 0%,100% { opacity:.2; transform:scale(.6); } 50% { opacity:1; transform:scale(1.1); } }
  #bigHeart { opacity:0; transform-box:fill-box; transform-origin:center; transform:scale(0); transition:all .6s .9s; }
  .yes #bigHeart { opacity:1; transform:scale(1); animation:beat 1.2s 1.6s ease-in-out infinite; }
  @keyframes beat { 15% { transform:scale(1.15); } 30% { transform:scale(1); } }

  /* terminal */
  .term { width:min(420px, 94vw); background:var(--term); color:#e9e3f5; border-radius:14px;
    padding:10px 12px 12px; text-align:left; font-family:var(--mono); font-size:12.5px; line-height:1.55;
    box-shadow:0 10px 28px rgba(43,36,56,.25); }
  .bar { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .bar i { width:10px; height:10px; border-radius:50%; display:block; }
  .bar span { margin-left:auto; color:#8f86a8; font-size:11px; }
  #out { height:clamp(150px, 26vh, 210px); overflow-y:auto; scrollbar-width:none; }
  #out::-webkit-scrollbar { display:none; }
  .p { color:#6be3a0; } .k { color:#ff9ec0; } .s { color:#b8f2c4; } .c { color:#8f86a8; }
  .h { color:#ffd166; } .d { color:#9ec5ff; }
  .cursor { display:inline-block; width:7px; background:#e9e3f5; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .pop { animation:popin .35s ease; }
  @keyframes popin { from { opacity:0; transform:translateX(-6px); } }

  /* butonul de commit */
  #commit { font-family:var(--mono); font-size:1rem; background:var(--term); color:#b8f2c4;
    box-shadow:0 6px 18px rgba(43,36,56,.3); padding:11px 26px; opacity:0; pointer-events:none;
    transition:opacity .4s, transform .15s; }
  #commit.ready { opacity:1; pointer-events:auto; animation:nudge 1.8s 2s ease-in-out infinite; }
  #commit:active { transform:scale(.94); }
  #commit small { color:#8f86a8; margin-left:8px; }
  @keyframes nudge { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }

  /* scrisoarea */
  .letter { width:min(420px, 94vw); min-height:clamp(150px, 26vh, 210px); background:#fffaf6;
    border-radius:16px; padding:16px 18px; text-align:left; font-size:1.05rem; line-height:1.55;
    box-shadow:0 10px 28px rgba(74,46,34,.15); border:2px solid #f6d6c8; }
  .letter p { margin:0 0 6px; }
  .letter .cursor { background:var(--ink); width:2px; }

  /* intrebarea */
  h1 { font-size:clamp(1.6rem, 7vw, 2.4rem); margin:2px 0 0; font-weight:800; line-height:1.2; min-height:1.2em; }
  h1 .cursor { background:var(--ink); width:3px; }
  .sub { margin:0; opacity:.65; font-size:.95rem; }
  .fade { opacity:0; transform:translateY(8px); transition:opacity .6s, transform .6s; }
  .fade.show { opacity:1; transform:none; }
  .btns { display:flex; gap:16px; margin-top:2px; }
  button { font:inherit; font-weight:800; font-size:1.15rem; border:none; border-radius:999px;
    padding:12px 34px; cursor:pointer; transition:transform .15s, background .3s; }
  #da, #nu.convertit { background:var(--accent); color:#fff; box-shadow:0 6px 18px rgba(239,111,148,.4); }
  #da:hover { transform:scale(1.08); }
  #nu { background:var(--soft); color:var(--ink); font-family:var(--mono); font-size:.95rem; }
  #nu.fugar { position:fixed; z-index:5; transition:left .25s, top .25s; white-space:nowrap; }

  .sprite { position:fixed; pointer-events:none; z-index:8; line-height:1; white-space:nowrap; }
  .fall { position:fixed; top:-30px; pointer-events:none; animation:fall linear forwards; z-index:9; }
  @keyframes fall { to { transform:translateY(110vh) rotate(300deg); opacity:.5; } }
  .hidden { display:none !important; }

  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <svg class="scene" viewBox="0 0 560 285" aria-label="Doi aricei programatori și un inel">
    <defs>
      <radialGradient id="spikeG" cx="50%" cy="35%" r="65%">
        <stop offset="0" stop-color="#c08b60"/><stop offset="1" stop-color="#83533a"/>
      </radialGradient>
      <radialGradient id="faceG" cx="45%" cy="35%" r="70%">
        <stop offset="0" stop-color="#fff3e6"/><stop offset="1" stop-color="#f2d0ad"/>
      </radialGradient>
      <radialGradient id="eyeG" cx="38%" cy="32%" r="70%">
        <stop offset="0" stop-color="#6b4634"/><stop offset="1" stop-color="#1c110b"/>
      </radialGradient>
      <linearGradient id="lidG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f1f3f8"/><stop offset="1" stop-color="#cfd5e1"/>
      </linearGradient>

      <!-- ariciul de baza (folosit pentru amandoi) -->
      <g id="hog" stroke="#4a2e22" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
        <path class="spkBack" fill="#6b4029"/>
        <path class="spkFront" fill="url(#spikeG)"/>
        <path class="tex" fill="none" stroke="#d6a77d" stroke-width="2.5"/>
        <!-- urechiuse -->
        <circle cx="96" cy="74" r="14" fill="url(#faceG)"/><circle cx="96" cy="74" r="7" fill="#f6b2bf" stroke="none"/>
        <circle cx="204" cy="74" r="14" fill="url(#faceG)"/><circle cx="204" cy="74" r="7" fill="#f6b2bf" stroke="none"/>
        <!-- hanorac -->
        <ellipse cx="150" cy="226" rx="72" ry="46" style="fill:var(--hood)"/>
        <ellipse cx="124" cy="212" rx="26" ry="14" fill="#fff" opacity=".22" stroke="none"/>
        <path d="M104 184 Q150 214 196 184" fill="none" stroke="rgba(74,46,34,.35)" stroke-width="5"/>
        <path d="M138 198 L135 222 M162 198 L165 222" fill="none" stroke-width="2.5"/>
        <circle cx="135" cy="224" r="3" fill="#fff"/><circle cx="165" cy="224" r="3" fill="#fff"/>
        <!-- fata -->
        <ellipse cx="150" cy="124" rx="72" ry="62" fill="url(#faceG)"/>
        <!-- breton de tepi -->
        <path d="M122 72 Q130 50 140 66 Q150 44 160 66 Q170 50 178 72 Q150 80 122 72 Z" fill="url(#spikeG)"/>
        <!-- ochi -->
        <g class="eyesOpen" stroke="none">
          <ellipse cx="122" cy="126" rx="13" ry="15" fill="url(#eyeG)"/>
          <circle cx="116" cy="119" r="5" fill="#fff"/><circle cx="127" cy="132" r="2.2" fill="#fff"/>
          <ellipse cx="178" cy="126" rx="13" ry="15" fill="url(#eyeG)"/>
          <circle cx="172" cy="119" r="5" fill="#fff"/><circle cx="183" cy="132" r="2.2" fill="#fff"/>
        </g>
        <g class="eyesHappy hidden" fill="none" stroke-width="4">
          <path d="M110 130 Q122 112 134 130"/><path d="M166 130 Q178 112 190 130"/>
        </g>
        <!-- ochelari -->
        <g stroke="#3b2a20" stroke-width="3" fill="rgba(255,255,255,.14)">
          <circle cx="122" cy="126" r="23"/><circle cx="178" cy="126" r="23"/>
        </g>
        <path d="M145 123 Q150 118 155 123" fill="none" stroke="#3b2a20" stroke-width="3"/>
        <path d="M108 112 L114 106 M164 112 L170 106" stroke="#fff" stroke-width="3" opacity=".8"/>
        <!-- obrajori -->
        <g class="blush" opacity=".8" stroke="none">
          <ellipse cx="98" cy="156" rx="12" ry="7" fill="#f6a3b4"/>
          <ellipse cx="202" cy="156" rx="12" ry="7" fill="#f6a3b4"/>
        </g>
        <path d="M92 158 l4 -5 M98 158 l4 -5 M196 158 l4 -5 M202 158 l4 -5" stroke="#e57f95" stroke-width="1.8"/>
        <!-- nasuc si gura -->
        <ellipse cx="150" cy="150" rx="7" ry="5" fill="#2b1a12" stroke="none"/>
        <circle cx="147.5" cy="148" r="1.8" fill="#fff" stroke="none"/>
        <path d="M140 159 Q145 165 150 159 Q155 165 160 159" fill="none" stroke-width="2.5"/>
      </g>
    </defs>

    <!-- EA: hanorac lavanda, fundita, brosa-vulpita -->
    <g id="her">
      <ellipse class="shadow late" cx="150" cy="276" rx="66" ry="7" fill="rgba(74,46,34,.13)"/>
      <g class="bob late">
        <use href="#hog" style="--hood:#c9aef0"/>
        <g stroke="#4a2e22" stroke-width="3" stroke-linejoin="round">
          <path d="M150 48 L128 36 Q122 48 128 60 Z M150 48 L172 36 Q178 48 172 60 Z" fill="#ef6f94"/>
          <circle cx="150" cy="48" r="6" fill="#d9567c"/>
        </g>
        <!-- vulpita -->
        <g transform="translate(182 214)" stroke="#4a2e22" stroke-width="2" stroke-linejoin="round">
          <path d="M-10 -6 L-7 -15 L-2 -7 Z M10 -6 L7 -15 L2 -7 Z" fill="#e8823a"/>
          <path d="M-11 -6 L11 -6 L0 9 Z" fill="#f39645"/>
          <path d="M-5 1 L5 1 L0 9 Z" fill="#fff" stroke="none"/>
          <circle cx="0" cy="8" r="1.6" fill="#2b1a12" stroke="none"/>
        </g>
        <g stroke="#4a2e22" stroke-width="3">
          <ellipse cx="116" cy="236" rx="13" ry="10" fill="url(#faceG)"/>
          <ellipse cx="184" cy="244" rx="13" ry="10" fill="url(#faceG)"/>
        </g>
      </g>
    </g>

    <!-- EL: hanorac albastru, laptop, inel -->
    <g id="him">
      <ellipse class="shadow" cx="150" cy="276" rx="66" ry="7" fill="rgba(74,46,34,.13)"/>
      <g class="bob">
        <use href="#hog" style="--hood:#8fa8ea"/>
        <g stroke="#4a2e22" stroke-width="3.5" stroke-linejoin="round">
          <rect x="90" y="186" width="120" height="78" rx="12" fill="url(#lidG)"/>
          <path d="M150 234 C150 234 134 224 134 214 C134 207 142 204 150 211 C158 204 166 207 166 214 C166 224 150 234 150 234 Z" fill="#ef6f94" stroke-width="2.5"/>
          <rect x="100" y="243" width="34" height="13" rx="4" fill="#2b2438" stroke-width="2"/>
        </g>
        <text x="117" y="253" font-family="monospace" font-size="9" fill="#b8f2c4" text-anchor="middle">&lt;/&gt;</text>
        <text x="186" y="256" font-size="14" text-anchor="middle">🦁</text>
        <g stroke="#4a2e22" stroke-width="3">
          <ellipse cx="110" cy="188" rx="14" ry="10" fill="url(#faceG)"/>
          <ellipse cx="190" cy="188" rx="14" ry="10" fill="url(#faceG)"/>
        </g>
      </g>
      <g id="ring" stroke-linejoin="round">
        <circle cx="262" cy="78" r="13" fill="none" stroke="#4a2e22" stroke-width="8"/>
        <circle cx="262" cy="78" r="13" fill="none" stroke="#f0c04f" stroke-width="4.5"/>
        <path d="M262 48 L272 58 L262 67 L252 58 Z" fill="#d6f3ff" stroke="#4a2e22" stroke-width="2.5"/>
        <path d="M258 55 L262 51" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </g>
      <path class="twinkle" d="M286 40 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#f0c04f"/>
      <path class="twinkle d2" d="M238 34 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z" fill="#ef6f94"/>
      <path class="twinkle d3" d="M36 64 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z" fill="#f0c04f"/>
    </g>

    <path id="bigHeart" d="M285 156 C285 156 266 144 266 132 C266 123 276 119 285 128 C294 119 304 123 304 132 C304 144 285 156 285 156 Z"
          fill="#ef6f94" stroke="#4a2e22" stroke-width="3" stroke-linejoin="round"/>
  </svg>

  <div class="term" id="term">
    <div class="bar"><i style="background:#ff6b6b"></i><i style="background:#ffd166"></i><i style="background:#6be3a0"></i><span>~/aricei</span></div>
    <div id="out"></div>
  </div>
  <div class="letter hidden" id="letter"></div>

  <button id="commit">git commit ❤<small id="prog"></small></button>

  <h1 id="q" class="hidden"></h1>
  <p id="sub" class="sub fade hidden"></p>
  <div class="btns fade hidden" id="btns">
    <button id="da">Da</button>
    <button id="nu">Nu</button>
  </div>
</div>

<script>
  // ============ PERSONALIZARE ============
  const CONFIG = {
    nume: "aricica",
    inceput: new Date(2017, 7, 11),          // 11 august 2017
    // kind = animatia care porneste dupa ce ea apasa "git commit"
    commits: [
      { hash: "a1b2c3d", date: "11.08.2017", kind: "meet",  msg: "init: doi aricei se întâlnesc la Galați 🦔🦔" },
      { hash: "360fa1c", date: "2017",       kind: "spin",  msg: "feat: echipa perfectă: ea crea imagini 360°, eu le transformam în tururi virtuale" },
      { hash: "7e3a91f", date: "",           kind: "crown", msg: "feat: „Vom construi împreună marele nostru imperiu” 👑" },
      { hash: "f0c5b0a", date: "",           kind: "fox",   msg: "feat: o vulpiță pentru aricica mea 🦊" },
      { hash: "2019bdc", date: "2019",       kind: "move",  msg: "refactor: Galați → București, prima noastră garsonieră, în Dristor" },
      { hash: "1e0c0de", date: "2019",       kind: "lion",  msg: "feat: ea la ING, eu la PwC, leuț la leuț 🦁" },
      { hash: "f1ea7e5", date: "",           kind: "plane", msg: "feat: am început să descoperim lumea împreună ✈️" },
      { hash: "7ec4ae0", date: "",           kind: "tech",  msg: "fix: am crezut unul în celălalt și am făcut împreună pasul spre tech 💻" },
      { hash: "dec0de1", date: "",           kind: "bug",   msg: "feat: pair programming pe viață, rezolvăm orice bug în doi 🐞" },
      { hash: "ca5a0ff", date: "",           kind: "house", msg: "wip: casa noastră 🏡" }
    ],
    // scrisoarea de dinainte de intrebare ({zile} se calculeaza automat)
    scrisoare: [
      "Aricica mea,",
      "de {zile} de zile scriem împreună cel mai frumos cod din viețile noastre.",
      "Am descoperit lumea împreună, am crezut unul în celălalt și am învățat unul de la altul.",
      "Fiecare commit al nostru ne-a adus exact aici.",
      "Mai avem un singur merge de făcut…"
    ],
    intrebare: "Vrei să fii soția mea?",
    semnatura: "— aricelul tău",
    erori: ["E501: răspuns prea lung", "PEP 8: „Nu” nu este permis", "IndentationError",
            "404: „Nu” not found", "ModuleNotFoundError: nu"]
  };
  // =======================================

  // tepi rotunjiti, in doua straturi + textura
  const CX = 150, CY = 118;
  const P = (r, a) => (CX + r * Math.cos(a)).toFixed(1) + "," + (CY + r * 0.92 * Math.sin(a)).toFixed(1);
  function spikeRing(rOut, rIn, n, rot) {
    let d = "";
    for (let i = 0; i < n; i++) {
      const a0 = rot + 2 * Math.PI * i / n, a1 = rot + 2 * Math.PI * (i + 1) / n, am = (a0 + a1) / 2;
      const rMid = (rIn + rOut) / 2 + 6;
      d += (i ? " L" : "M") + P(rIn, a0) +
           " Q" + P(rMid, a0 + (am - a0) * 0.25) + " " + P(rOut, am) +
           " Q" + P(rMid, a1 - (a1 - am) * 0.25) + " " + P(rIn, a1);
    }
    return d + " Z";
  }
  document.querySelector(".spkBack").setAttribute("d", spikeRing(106, 84, 18, Math.PI / 18));
  document.querySelector(".spkFront").setAttribute("d", spikeRing(98, 80, 18, 0));
  let tex = "";
  for (let i = 0; i < 12; i++) {
    const a = Math.PI * (1.05 + 0.9 * i / 11);
    tex += "M" + P(80, a) + " L" + P(89, a + 0.04) + " ";
  }
  document.querySelector(".tex").setAttribute("d", tex);

  // ---------- utilitare ----------
  const $ = id => document.getElementById(id);
  const out = $("out"), scene = document.querySelector("svg.scene");
  const CUR = '<span class="cursor">&nbsp;</span>';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const zile = Math.floor((Date.now() - CONFIG.inceput) / 86400000);

  function line(html) {
    const d = document.createElement("div");
    d.className = "pop"; d.innerHTML = html; out.appendChild(d);
    out.scrollTop = out.scrollHeight; return d;
  }
  // scrie text caracter cu caracter intr-un element
  async function typeInto(el, prefix, text, speed, suffix = "") {
    const chars = Array.from(text);
    for (let i = 0; i <= chars.length; i++) {
      el.innerHTML = prefix + esc(chars.slice(0, i).join("")) + CUR;
      if (el.closest("#out")) out.scrollTop = out.scrollHeight;
      await sleep(speed + Math.random() * speed * 0.6);
    }
    el.innerHTML = prefix + esc(text) + suffix;
  }
  const type = (prompt, text) => typeInto(line(""), prompt, text, 38);
  const SH = '<span class="p">$</span> ', PY = '<span class="k">&gt;&gt;&gt;</span> ';

  // asteapta ca ea sa apese "git commit"
  function waitCommit(i, n) {
    const b = $("commit");
    $("prog").textContent = (i + 1) + "/" + n;
    b.classList.add("ready");
    return new Promise(res => b.onclick = () => { b.classList.remove("ready"); b.onclick = null; res(); });
  }

  // ---------- mini-animatii ----------
  function anchor() {   // capul aricelului, in coordonate de ecran
    const r = scene.getBoundingClientRect();
    return { x: r.left + r.width * 0.5, y: r.top + r.height * 0.42, r };
  }
  function sprite(txt, x0, y0, x1, y1, o = {}) {
    const { dur = 1600, size = 32, rot = 0, fade = true, delay = 0, hold = false } = o;
    const s = document.createElement("div");
    s.className = "sprite"; s.innerHTML = txt;
    s.style.fontSize = size + "px"; s.style.left = x0 + "px"; s.style.top = y0 + "px";
    if (o.color) s.style.color = o.color;
    if (o.mono) s.style.fontFamily = "var(--mono)";
    document.body.appendChild(s);
    const end = `translate(calc(-50% + ${x1 - x0}px), calc(-50% + ${y1 - y0}px)) rotate(${rot}deg) scale(1)`;
    const frames = [
      { transform: "translate(-50%,-50%) scale(.2)", opacity: 0 },
      { transform: "translate(-50%,-50%) scale(1)", opacity: 1, offset: .15 },
      hold ? { transform: end, opacity: 1, offset: .8 } : null,
      { transform: end, opacity: fade ? 0 : 1 }
    ].filter(Boolean);
    const a = s.animate(frames, { duration: dur, delay, easing: "cubic-bezier(.3,.7,.4,1)", fill: "both" });
    a.onfinish = () => s.remove();
  }
  function burst(items, n = 10, dist = 120, o = {}) {
    const { x, y } = anchor();
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, d = dist * (0.6 + Math.random() * 0.6);
      sprite(items[i % items.length], x, y, x + Math.cos(a) * d, y + Math.sin(a) * d,
             { size: 16 + Math.random() * 14, delay: i * 40, rot: (Math.random() - .5) * 120, ...o });
    }
  }
  function happy(ms = 1200) {
    document.querySelectorAll(".eyesOpen").forEach(e => e.classList.add("hidden"));
    document.querySelectorAll(".eyesHappy").forEach(e => e.classList.remove("hidden"));
    document.body.classList.add("hop");
    setTimeout(() => {
      document.body.classList.remove("hop");
      if (document.body.classList.contains("yes")) return;
      document.querySelectorAll(".eyesOpen").forEach(e => e.classList.remove("hidden"));
      document.querySelectorAll(".eyesHappy").forEach(e => e.classList.add("hidden"));
    }, ms);
  }
  const W = () => window.innerWidth;

  const ANIM = {
    meet() {
      const { x, y } = anchor();
      sprite("🦔", -30, y, x - 30, y + 40, { size: 40, dur: 1800, hold: true });
      sprite("🦔", W() + 30, y, x + 30, y + 40, { size: 40, dur: 1800, hold: true });
      setTimeout(() => sprite("💕", x, y + 20, x, y - 40, { size: 36, dur: 1400 }), 1100);
    },
    spin() {
      const { x, y } = anchor();
      scene.classList.remove("spin"); void scene.getBoundingClientRect(); scene.classList.add("spin");
      sprite("360°", x, y - 60, x, y - 110, { size: 30, mono: true, color: "#8fa8ea", dur: 1800 });
      setTimeout(() => scene.classList.remove("spin"), 1400);
    },
    crown() {
      const { x, r } = anchor();
      sprite("👑", x, r.top - 80, x, r.top + r.height * 0.05, { size: 44, dur: 2400, hold: true });
      setTimeout(() => burst(["✨", "⭐"], 8, 90), 900);
    },
    fox() {
      const { x, y } = anchor();
      sprite("🦊", x + 70, y + 120, x + 70, y - 10, { size: 42, dur: 2200, hold: true });
      setTimeout(() => burst(["🧡", "💕"], 6, 80), 700);
    },
    move() {
      const { r } = anchor();
      const yy = r.bottom - 10;
      sprite("🚚💨", W() + 40, yy, -120, yy, { size: 34, dur: 2600, fade: false });
      setTimeout(() => sprite("🏙️", W() / 2, yy - 40, W() / 2, yy - 80, { size: 34, dur: 1600 }), 1400);
    },
    lion() {
      const { x, y } = anchor();
      sprite("🦁", -30, y + 30, x - 26, y + 30, { size: 38, dur: 1900, hold: true });
      sprite("🦁", W() + 30, y + 30, x + 26, y + 30, { size: 38, dur: 1900, hold: true });
      setTimeout(() => sprite("❤", x, y + 10, x, y - 50, { size: 30, color: "#ef6f94", dur: 1300 }), 1100);
    },
    plane() {
      const { y } = anchor();
      sprite("✈️", -40, y + 80, W() + 40, y - 90, { size: 34, dur: 2400, fade: false, rot: -10 });
      ["🗺️", "🏔️", "🏝️"].forEach((e, i) =>
        setTimeout(() => sprite(e, W() * (.25 + .25 * i), y + 30, W() * (.25 + .25 * i), y - 20, { size: 26, dur: 1400 }), 400 + i * 400));
    },
    tech() {
      burst(["&lt;/&gt;", "{ }", "def", "()", "💻"], 12, 130, { mono: true, color: "#8fa8ea" });
    },
    bug() {
      const t = $("term").getBoundingClientRect();
      const yy = t.top + t.height * 0.55;
      sprite("🐞", t.left - 10, yy, t.left + t.width * 0.6, yy, { size: 26, dur: 1500, fade: false, hold: true });
      setTimeout(() => sprite("✓ fixed", t.left + t.width * 0.6, yy, t.left + t.width * 0.6, yy - 40,
                              { size: 18, mono: true, color: "#6be3a0", dur: 1400 }), 1300);
    },
    house() {
      const { x, y } = anchor();
      sprite("🏡", x, y + 40, x, y - 30, { size: 56, dur: 2600, hold: true });
      setTimeout(() => sprite("🚧 wip", x, y - 70, x, y - 110, { size: 18, mono: true, dur: 1600 }), 600);
      setTimeout(() => burst(["✨", "💛"], 8, 100), 1200);
    }
  };

  // ---------- povestea ----------
  async function poveste() {
    await sleep(800);
    await type(SH, "git log --reverse relatia");
    await sleep(500);
    const n = CONFIG.commits.length;
    for (let i = 0; i < n; i++) {
      const c = CONFIG.commits[i];
      const pre = '<span class="h">' + c.hash + '</span> ' + (c.date ? '<span class="d">' + c.date + '</span> ' : '');
      await typeInto(line(""), pre, c.msg, 45);
      await waitCommit(i, n);
      line('<span class="s">  ✓ committed</span>');
      happy();
      (ANIM[c.kind] || (() => burst(["❤"], 8)))();
      await sleep(1700);
    }
    line('<span class="c"># ' + zile + ' zile în producție, 0 rollback-uri</span>');
    await sleep(1000);
    await type(SH, "flake8 propunere.py");
    line('<span class="s">✓ 0 probleme. 100% PEP 8.</span>');
    await sleep(900);
    await type(PY, 'aricel.propose(to="' + CONFIG.nume + '")');
    await sleep(1300);
    await scrisoare();
  }

  async function scrisoare() {
    $("term").classList.add("hidden");
    $("commit").classList.add("hidden");
    const L = $("letter"); L.classList.remove("hidden");
    for (const raw of CONFIG.scrisoare) {
      const p = document.createElement("p"); L.appendChild(p);
      await typeInto(p, "", raw.replace("{zile}", zile), 55);
      await sleep(1100);
    }
    await sleep(700);
    const q = $("q"); q.classList.remove("hidden");
    await typeInto(q, "", CONFIG.intrebare, 110);
    await sleep(900);
    $("sub").textContent = CONFIG.semnatura;
    for (const id of ["sub", "btns"]) {
      $(id).classList.remove("hidden"); void $(id).offsetWidth;
      $(id).classList.add("show"); await sleep(700);
    }
  }
  poveste();

  // butonul Nu: fuge, arunca erori, apoi cedeaza si devine Da
  const nu = $("nu");
  let incercari = 0;
  function fugi(ev) {
    if (nu.classList.contains("convertit")) return;
    if (ev) ev.preventDefault();
    if (incercari >= CONFIG.erori.length) {
      nu.textContent = "Da 💍"; nu.classList.add("convertit"); return;
    }
    nu.textContent = CONFIG.erori[incercari++];
    nu.classList.add("fugar");
    const w = window.innerWidth - nu.offsetWidth - 16, h = window.innerHeight - nu.offsetHeight - 16;
    nu.style.left = (8 + Math.random() * w) + "px";
    nu.style.top = (8 + Math.random() * h) + "px";
  }
  nu.addEventListener("mouseenter", fugi);
  nu.addEventListener("touchstart", fugi, { passive: false });
  nu.addEventListener("click", ev => nu.classList.contains("convertit") ? da() : fugi(ev));
  $("da").addEventListener("click", da);

  // DA!
  let gata = false;
  async function da() {
    if (gata) return; gata = true;
    document.body.classList.add("yes");
    document.querySelectorAll(".eyesOpen").forEach(e => e.classList.add("hidden"));
    document.querySelectorAll(".eyesHappy").forEach(e => e.classList.remove("hidden"));
    document.querySelectorAll(".blush").forEach(e => e.setAttribute("opacity", "1"));
    $("btns").classList.add("hidden"); nu.classList.add("hidden");
    $("letter").classList.add("hidden"); $("sub").classList.add("hidden");
    $("q").textContent = "A spus DA! 💍";
    $("term").classList.remove("hidden");
    ploaie();
    line('<span class="s">True</span>');
    await sleep(600);
    await type(SH, 'git commit -m "feat: ne căsătorim 💍"');
    line('[main ' + new Date().toLocaleDateString("ro-RO") + '] 2 aricei schimbați, ∞ inserări(+), 0 ștergeri(-)');
    await sleep(800);
    $("sub").textContent = "Acum întoarce-te. Am ceva pentru tine.";
    $("sub").classList.remove("hidden");
  }

  function ploaie() {
    const bits = ["❤", "💕", "🦔", "🦊", "🦁", "&lt;/&gt;", "✨"];
    for (let i = 0; i < 80; i++) setTimeout(() => {
      const s = document.createElement("span");
      s.className = "fall";
      s.innerHTML = bits[i % bits.length];
      s.style.color = i % 3 ? "#ef6f94" : "#8fa8ea";
      s.style.fontFamily = "var(--mono)";
      s.style.left = Math.random() * 100 + "vw";
      s.style.fontSize = (14 + Math.random() * 20) + "px";
      s.style.animationDuration = (3 + Math.random() * 3) + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 7000);
    }, i * 70);
  }
</script>
</body>
</html>
